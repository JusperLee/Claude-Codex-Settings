[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccsync"
version = "0.1.0"
description = "Sync Codex and Claude Code settings over SSH"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ccsync contributors"}]
dependencies = []

[project.scripts]
ccsync = "ccsync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
